[package]
name = "simpalt"
version = "0.3.14"
edition = "2024"

[dependencies]
base64 = "0.23.0"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
flate2 = "1.1.9"
git2 = "0.21.0"
simd-json = { version = "0.17.3", default-features = false, features = [
  "swar-number-parsing",
  "runtime-detection",
] }

[dev-dependencies]
regex = "1.13.1"
tempfile = "3.27.0"
